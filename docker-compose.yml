# Local WordPress for developing the Ludoya plugin.
#   docker compose up -d      →  http://localhost:8888  (admin/admin)
# The repo is mounted live as wp-content/plugins/ludoya, so edits need no rebuild.
services:
  db:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 20

  wordpress:
    image: wordpress:6.8-php8.3-apache
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8888:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      # host.docker.internal reaches a backend running on the Windows host
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_DEBUG', true );
        define( 'WP_DEBUG_LOG', true );
        define( 'WP_DEBUG_DISPLAY', false );
        define( 'SCRIPT_DEBUG', true );
    volumes:
      - wp:/var/www/html
      - ./:/var/www/html/wp-content/plugins/ludoya
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # One-shot: installs WordPress and activates the plugin, then exits.
  cli:
    image: wordpress:cli-php8.3
    depends_on:
      - wordpress
    user: "33:33"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
    volumes:
      - wp:/var/www/html
      - ./:/var/www/html/wp-content/plugins/ludoya
    extra_hosts:
      - "host.docker.internal:host-gateway"
    entrypoint: /bin/sh
    command:
      - -c
      - |
        until wp db check >/dev/null 2>&1; do sleep 2; done
        wp core install --url=http://localhost:8888 --title="Ludoya WP Dev" \
          --admin_user=admin --admin_password=admin --admin_email=dev@ludoya.com --skip-email || true
        wp plugin activate ludoya || true
        wp rewrite structure '/%postname%/' --hard || true
        wp option update blogdescription "Ludoya plugin test site" || true

volumes:
  db:
  wp:
